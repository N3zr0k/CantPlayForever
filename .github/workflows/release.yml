name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/check.py --tag ${{ github.ref_name }}
      # alpha: nur GitHub-Prerelease (-p 0 deaktiviert CurseForge); beta/latest: zusätzlich CurseForge
      # Projekt-ID hier und in der TOC (X-Curse-Project-ID) eintragen: CF_ID
      - uses: BigWigsMods/packager@v2
        with:
          args: ${{ contains(github.ref_name, '-alpha.') && '-p 0 -w 0 -a 0' || '-p CF_ID -w 0 -a 0' }}
